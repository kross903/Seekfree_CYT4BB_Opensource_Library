<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <style>
      .t{font-family:"Microsoft YaHei",sans-serif;fill:#17324d}
      .h{font-size:30px;font-weight:700}
      .s{font-size:19px}
      .l{font-size:16px;fill:#355a76}
      .p{fill:#fff5e8;stroke:#d97706;stroke-width:2}
      .b{fill:#f7fbff;stroke:#2f6f9f;stroke-width:2}
      .c{fill:#edf8ef;stroke:#2f855a;stroke-width:2}
      .m{fill:#f4efff;stroke:#7653a6;stroke-width:2}
      .a{stroke:#355a76;stroke-width:3;fill:none;marker-end:url(#e)}
    </style>
    <marker id="e" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#355a76"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#fff"/>
  <text x="600" y="55" text-anchor="middle" class="t h">LEDV4.1 红外灯板总体设计框图</text>

  <rect x="45" y="190" width="190" height="150" rx="12" class="p"/>
  <text x="140" y="245" text-anchor="middle" class="t s">
    <tspan x="140">三针输入接口</tspan>
    <tspan x="140" dy="34">5 V / SIG / GND</tspan>
  </text>

  <rect x="315" y="160" width="265" height="210" rx="12" class="b"/>
  <text x="447" y="205" text-anchor="middle" class="t s">
    <tspan x="447">电源与 PWM 信号调理</tspan>
    <tspan x="447" dy="38">AMS1117-3.3</tspan>
    <tspan x="447" dy="30">生成缓冲器用 3.3 V 电源</tspan>
    <tspan x="447" dy="38">SN74LVC1G125DBVR</tspan>
    <tspan x="447" dy="30">PWM 同相缓冲 / 5 V 直通</tspan>
  </text>

  <rect x="660" y="175" width="235" height="180" rx="12" class="c"/>
  <text x="777" y="220" text-anchor="middle" class="t s">
    <tspan x="777">9 路 BCR421UE6327</tspan>
    <tspan x="777" dy="34">线性恒流驱动</tspan>
    <tspan x="777" dy="34">EN/PWM 数字调光</tspan>
    <tspan x="777" dy="34">Rext = 22 Ω</tspan>
  </text>

  <rect x="975" y="170" width="190" height="190" rx="12" class="m"/>
  <text x="1070" y="215" text-anchor="middle" class="t s">
    <tspan x="1070">红外发射阵列</tspan>
    <tspan x="1070" dy="32">9 个串联支路</tspan>
    <tspan x="1070" dy="32">每路 2 颗 LED</tspan>
    <tspan x="1070" dy="32">共 18 颗 LED</tspan>
    <tspan x="1070" dy="32">条形均匀分布</tspan>
  </text>

  <path d="M235 265 H315" class="a"/>

  <path d="M580 265 H660" class="a"/>

  <path d="M895 265 H975" class="a"/>

  <rect x="285" y="455" width="630" height="85" rx="12" fill="#fafafa" stroke="#7b8794" stroke-width="2"/>
  <text x="600" y="490" text-anchor="middle" class="t s">
    <tspan x="600">控制器改变 PWM 占空比 → 恒流驱动单元改变导通时间</tspan>
    <tspan x="600" dy="30">→ 调节红外补光强度</tspan>
  </text>
</svg>
