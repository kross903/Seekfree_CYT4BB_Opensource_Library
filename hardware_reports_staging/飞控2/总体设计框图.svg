<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 19px; font-weight: 700; }
      .label { font-size: 17px; }
      .small { font-size: 14px; }
      .power-frame { fill: #fffaf2; stroke: #d97706; stroke-width: 2.5; }
      .power-node { fill: #fff4df; stroke: #d97706; stroke-width: 2; }
      .core { fill: #edf8ef; stroke: #2f855a; stroke-width: 2.5; }
      .module { fill: #f7fbff; stroke: #2f6f9f; stroke-width: 2; }
      .actuator { fill: #f4efff; stroke: #7653a6; stroke-width: 2; }
      .note { fill: #fafafa; stroke: #7b8794; stroke-width: 2; }
      .power-line { stroke: #d97706; stroke-width: 3; fill: none; marker-end: url(#power-arrow); }
      .power-bus { stroke: #d97706; stroke-width: 3; fill: none; }
      .signal-bus { stroke: #355a76; stroke-width: 2.5; fill: none; }
      .signal-line { stroke: #355a76; stroke-width: 2.5; fill: none; marker-start: url(#signal-arrow-start); marker-end: url(#signal-arrow); }
      .control-line { stroke: #355a76; stroke-width: 2.5; fill: none; marker-end: url(#signal-arrow); }
      .monitor-line { stroke: #65758b; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; marker-end: url(#monitor-arrow); }
    </style>
    <marker id="power-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" viewBox="0 0 12 8">
      <path d="M0,0 L12,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="signal-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" viewBox="0 0 12 8">
      <path d="M0,0 L12,4 L0,8 Z" fill="#355a76"/>
    </marker>
    <marker id="signal-arrow-start" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="1" refY="4" orient="auto" viewBox="0 0 12 8">
      <path d="M12,0 L0,4 L12,8 Z" fill="#355a76"/>
    </marker>
    <marker id="monitor-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" viewBox="0 0 12 8">
      <path d="M0,0 L12,4 L0,8 Z" fill="#65758b"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="44" text-anchor="middle" class="text title">飞控 V2.4 总体设计框图</text>

  <!-- Power input and monitoring -->
  <rect x="25" y="120" width="160" height="90" rx="8" class="power-node"/>
  <text x="105" y="155" text-anchor="middle" class="text label">
    <tspan x="105">动力电池输入</tspan>
    <tspan x="105" dy="27">VBAT / GND</tspan>
  </text>
  <rect x="25" y="270" width="160" height="80" rx="8" class="module"/>
  <text x="105" y="302" text-anchor="middle" class="text label">
    <tspan x="105">电池电压检测</tspan>
    <tspan x="105" dy="25">分压 / ADC</tspan>
  </text>

  <!-- Grouped power subsystem -->
  <rect x="220" y="70" width="390" height="420" rx="8" class="power-frame"/>
  <text x="415" y="103" text-anchor="middle" class="text section">电源模块</text>
  <rect x="245" y="125" width="150" height="70" rx="8" class="power-node"/>
  <text x="320" y="153" text-anchor="middle" class="text label">
    <tspan x="320">5 V 开关电源</tspan>
    <tspan x="320" dy="25">主电源</tspan>
  </text>
  <rect x="430" y="110" width="150" height="65" rx="8" class="power-node"/>
  <text x="505" y="150" text-anchor="middle" class="text label">外设受控 5 V</text>
  <rect x="430" y="220" width="150" height="65" rx="8" class="power-node"/>
  <text x="505" y="260" text-anchor="middle" class="text label">3.3 V 稳压</text>
  <rect x="430" y="330" width="150" height="75" rx="8" class="power-node"/>
  <text x="505" y="360" text-anchor="middle" class="text label">
    <tspan x="505">摄像头降压</tspan>
    <tspan x="505" dy="25">受控供电</tspan>
  </text>
  <path d="M185 165 H245" class="power-line"/>
  <path d="M395 160 H412 M412 142 V367" class="power-bus"/>
  <path d="M412 142 H430" class="power-line"/>
  <path d="M412 252 H430" class="power-line"/>
  <path d="M412 367 H430" class="power-line"/>
  <path d="M105 210 V270" class="monitor-line"/>

  <!-- Control core -->
  <rect x="665" y="150" width="245" height="220" rx="8" class="core"/>
  <text x="787" y="198" text-anchor="middle" class="text label">
    <tspan x="787" font-size="22" font-weight="700">CYT4B 系列核心板</tspan>
    <tspan x="787" dy="40">姿态解算 / 飞行控制</tspan>
    <tspan x="787" dy="31">任务决策 / 地空协同</tspan>
    <tspan x="787" dy="31">接口与故障管理</tspan>
  </text>

  <!-- Peripheral and interface modules -->
  <rect x="1020" y="70" width="330" height="80" rx="8" class="module"/>
  <text x="1185" y="101" text-anchor="middle" class="text label">
    <tspan x="1185">姿态与运动传感器接口</tspan>
    <tspan x="1185" dy="25">陀螺仪 / 光流 / TOF</tspan>
  </text>
  <rect x="1020" y="170" width="330" height="80" rx="8" class="module"/>
  <text x="1185" y="201" text-anchor="middle" class="text label">
    <tspan x="1185">视觉感知接口</tspan>
    <tspan x="1185" dy="25">红外摄像头</tspan>
  </text>
  <rect x="1020" y="270" width="330" height="80" rx="8" class="module"/>
  <text x="1185" y="301" text-anchor="middle" class="text label">
    <tspan x="1185">通信接口</tspan>
    <tspan x="1185" dy="25">无线 UART / 小车通信</tspan>
  </text>
  <rect x="1020" y="370" width="330" height="80" rx="8" class="module"/>
  <text x="1185" y="401" text-anchor="middle" class="text label">
    <tspan x="1185">人机交互接口</tspan>
    <tspan x="1185" dy="25">屏幕 / 按键 / 拨码 / 蜂鸣器</tspan>
  </text>
  <rect x="1020" y="470" width="330" height="80" rx="8" class="module"/>
  <text x="1185" y="501" text-anchor="middle" class="text label">
    <tspan x="1185">通用扩展接口</tspan>
    <tspan x="1185" dy="25">SPI / UART / 软件 I²C</tspan>
  </text>

  <!-- Core data bus, separated from the orange power bus -->
  <path d="M910 260 H950" class="signal-line"/>
  <path d="M950 110 V510" class="signal-bus"/>
  <path d="M950 110 H1020" class="control-line"/>
  <path d="M950 210 H1020" class="control-line"/>
  <path d="M950 310 H1020" class="control-line"/>
  <path d="M950 410 H1020" class="control-line"/>
  <path d="M950 510 H1020" class="control-line"/>

  <!-- Confirmed power distribution to the corresponding interfaces -->
  <path d="M580 252 H630 V215 H665" class="power-line"/>
  <path d="M580 142 H630 V60 H1375 V525" class="power-bus"/>
  <path d="M1375 135 H1350" class="power-line"/>
  <path d="M1375 325 H1350" class="power-line"/>
  <path d="M1375 425 H1350" class="power-line"/>
  <path d="M1375 525 H1350" class="power-line"/>
  <path d="M580 367 H645 V600 H1390 V210 H1385 C1385 198 1365 198 1365 210 H1350" class="power-line"/>
  <text x="835" y="594" text-anchor="middle" class="text small" fill="#a65305">摄像头降压 / 受控供电</text>

  <!-- Battery monitoring -->
  <path d="M185 310 H205 V515 H787 V370" class="monitor-line"/>

  <!-- Motor control chain -->
  <rect x="665" y="615" width="245" height="100" rx="8" class="module"/>
  <text x="787" y="642" text-anchor="middle" class="text label">
    <tspan x="787">电调控制输出</tspan>
    <tspan x="787" dy="25">串口（实际使用）</tspan>
    <tspan x="787" dy="25">4 路 PWM（兼容）</tspan>
  </text>
  <rect x="1020" y="625" width="155" height="80" rx="8" class="actuator"/>
  <text x="1097" y="656" text-anchor="middle" class="text label">
    <tspan x="1097">四合一电调</tspan>
    <tspan x="1097" dy="25">ESC</tspan>
  </text>
  <rect x="1205" y="625" width="145" height="80" rx="8" class="actuator"/>
  <text x="1277" y="656" text-anchor="middle" class="text label">
    <tspan x="1277">四台无刷电机</tspan>
    <tspan x="1277" dy="25">M1～M4</tspan>
  </text>
  <path d="M787 370 V615" class="control-line"/>
  <path d="M910 665 H1020" class="control-line"/>
  <path d="M1175 665 H1205" class="control-line"/>
  <path d="M25 165 H10 V750 H1097 V705" class="power-line"/>
  <text x="520" y="744" text-anchor="middle" class="text small" fill="#a65305">动力电池向电调供电（VBAT）</text>

  <!-- Legend -->
  <path d="M790 790 H845" class="power-line"/>
  <text x="855" y="796" class="text small">供电路径</text>
  <path d="M960 790 H1015" class="signal-line"/>
  <text x="1025" y="796" class="text small">数据 / 控制</text>
  <path d="M1145 790 H1200" class="monitor-line"/>
  <text x="1210" y="796" class="text small">监测路径</text>
</svg>
